name: Game checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:game
      - run: npm run build:game
      - uses: actions/upload-artifact@v4
        with:
          name: ludoria-game
          path: out/
